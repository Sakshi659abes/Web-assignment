<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body  class="container" style="border: 50px; padding-right:30%; padding-left: 30%; background-color: rgb(143, 232, 202);">
    <h2 style="text-align: center;">Registration Form</h2>
    <form style="background-color: rgb(148, 148, 235);" >
        <div class="mb-5">
         <label class="form-label">Name</label>
         <input type="name" class="form-control" placeholder="Enter username">
        </div>
        <div class="mb-5">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Enter password">
        </div>
        <div class="mb-5">
            <label class="form-label">Emai Id</label>
            <input type="email" class="form-control" placeholder="Enter email">
        </div>
        <div class="mb-5">
            <h5>Course:</h5>
            <select class="form selected" >
                <option selected>Select your course</option>
                <option value="1" >MCA</option>
                <option value="2" >MBA</option>
                <option value="3" >BBA</option>
            </select>

        </div>
        <button type="button" class="btn btn-primary">Submit</button>
    </form>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</body>
</html>
